name: Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - stage
          - production
        default: stage

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  NX_DAEMON: 'false'

jobs:
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.affected.outputs.base }}
      head: ${{ steps.affected.outputs.head }}
      image_matrix: ${{ steps.affected.outputs.image_matrix }}
      image_services: ${{ steps.affected.outputs.image_services }}
      has_images: ${{ steps.affected.outputs.has_images }}
      deploy_needed: ${{ steps.affected.outputs.deploy_needed }}
      e2e_projects: ${{ steps.affected.outputs.e2e_projects }}
      backend_e2e_projects: ${{ steps.affected.outputs.backend_e2e_projects }}
      has_e2e: ${{ steps.affected.outputs.has_e2e }}
      infra_changed: ${{ steps.affected.outputs.infra_changed }}
      edge_changed: ${{ steps.affected.outputs.edge_changed }}
      deploy_environment: ${{ steps.affected.outputs.deploy_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          --read-only
          --network none
          --volume "$PWD:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate affected projects
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_ENVIRONMENT_INPUT: ${{ inputs.deploy_environment || '' }}
          GIT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu

          case "$EVENT_NAME" in
            pull_request)
              deploy_environment=stage
              ;;
            push)
              deploy_environment=production
              ;;
            workflow_dispatch)
              deploy_environment=$DEPLOY_ENVIRONMENT_INPUT
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [ "$deploy_environment" != "stage" ] &&
            [ "$deploy_environment" != "production" ]; then
            echo "Unsupported deploy environment: $deploy_environment" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
            [ "$deploy_environment" = "production" ] &&
            [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "Manual production deploys must use the main branch" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            head="$PUSH_HEAD_SHA"
            base=$(git rev-parse "$head^" 2>/dev/null || true)
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
          fi

          case "$base" in
            '' | 0000000000000000000000000000000000000000)
              base=$(git rev-list --max-parents=0 "$head")
              ;;
          esac

          changed_files=$(git diff --name-only "$base" "$head")
          root_changed=false
          runtime_deployment_changed=false
          edge_changed=false
          infra_changed=false

          if printf '%s\n' "$changed_files" | grep -Eq '^[^/]+$'; then
            root_changed=true
          fi

          if printf '%s\n' "$changed_files" |
            grep -Eq '^(infra/|docker-compose\.yml$|\.dockerignore$)'; then
            infra_changed=true
          fi

          if printf '%s\n' "$changed_files" |
            grep -Eq '^(infra/(env|scripts)/|infra/compose/compose\.deploy\.yml$)'; then
            runtime_deployment_changed=true
          fi

          if printf '%s\n' "$changed_files" |
            grep -Eq '^(infra/nginx/|infra/compose/compose\.edge\.yml$)'; then
            edge_changed=true
          fi

          affected_projects=$(pnpm nx show projects \
            --affected \
            --base="$base" \
            --head="$head" \
            --json)

          if [ "$EVENT_NAME" = "workflow_dispatch" ] ||
            [ "$root_changed" = "true" ] ||
            printf '%s\n' "$changed_files" | grep -Eq '^infra/docker/'; then
            affected_projects='["web","studio","admin","api","worker-media","worker-notifications","web-e2e","studio-e2e","admin-e2e","api-e2e","worker-media-e2e","worker-notifications-e2e"]'
          fi

          image_matrix=$(jq -cn --argjson affected "$affected_projects" '
            [
              {
                image: "web",
                project: "web",
                target: "web",
                dockerfile: "infra/docker/Dockerfile.frontend"
              },
              {
                image: "studio",
                project: "studio",
                target: "studio",
                dockerfile: "infra/docker/Dockerfile.frontend"
              },
              {
                image: "admin",
                project: "admin",
                target: "admin",
                dockerfile: "infra/docker/Dockerfile.frontend"
              },
              {
                image: "api",
                project: "api",
                target: "api",
                dockerfile: "infra/docker/Dockerfile.backend"
              },
              {
                image: "worker-media",
                project: "worker-media",
                target: "worker-media",
                dockerfile: "infra/docker/Dockerfile.backend"
              },
              {
                image: "worker-notifications",
                project: "worker-notifications",
                target: "worker-notifications",
                dockerfile: "infra/docker/Dockerfile.backend"
              }
            ] |
            map(
              .project as $project |
              . + {build: ($affected | index($project) != null)}
            ) |
            if any(.build) then . else [] end
          ')

          image_services=$(printf '%s' "$image_matrix" |
            jq -r '[.[].image] | join(",")')
          e2e_projects=$(printf '%s' "$affected_projects" |
            jq -r '[
              .[] |
              select(
                . == "web-e2e" or
                . == "studio-e2e" or
                . == "admin-e2e"
              )
            ] | join(",")')
          backend_e2e_projects=$(printf '%s' "$affected_projects" |
            jq -r '[
              .[] |
              select(
                . == "api-e2e" or
                . == "worker-media-e2e" or
                . == "worker-notifications-e2e"
              )
            ] | join(",")')

          if [ "$(printf '%s' "$image_matrix" | jq length)" -gt 0 ]; then
            has_images=true
          else
            has_images=false
          fi

          if [ -n "$e2e_projects" ] || [ -n "$backend_e2e_projects" ]; then
            has_e2e=true
          else
            has_e2e=false
          fi

          if [ "$has_images" = "true" ] ||
            [ "$runtime_deployment_changed" = "true" ] ||
            { [ "$EVENT_NAME" != "pull_request" ] && [ "$edge_changed" = "true" ]; }; then
            deploy_needed=true
          else
            deploy_needed=false
          fi

          {
            printf 'base=%s\n' "$base"
            printf 'head=%s\n' "$head"
            printf 'image_matrix=%s\n' "$image_matrix"
            printf 'image_services=%s\n' "$image_services"
            printf 'has_images=%s\n' "$has_images"
            printf 'deploy_needed=%s\n' "$deploy_needed"
            printf 'e2e_projects=%s\n' "$e2e_projects"
            printf 'backend_e2e_projects=%s\n' "$backend_e2e_projects"
            printf 'has_e2e=%s\n' "$has_e2e"
            printf 'infra_changed=%s\n' "$infra_changed"
            printf 'edge_changed=%s\n' "$edge_changed"
            printf 'deploy_environment=%s\n' "$deploy_environment"
          } >>"$GITHUB_OUTPUT"

  quality:
    needs:
      - changes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check project references
        run: pnpm nx sync:check

      - name: Validate affected infrastructure
        if: needs.changes.outputs.infra_changed == 'true'
        run: |
          set -eu

          docker compose \
            --env-file infra/env/stage.env.example \
            --env-file infra/env/release.env.example \
            -f infra/compose/compose.deploy.yml \
            config --quiet
          docker compose \
            --env-file infra/env/production.env.example \
            --env-file infra/env/release.env.example \
            -f infra/compose/compose.deploy.yml \
            config --quiet
          docker compose \
            --env-file infra/env/edge.env.example \
            -f infra/compose/compose.edge.yml \
            config --quiet

          for script in infra/scripts/*.sh; do
            sh -n "$script"
          done

          docker run --rm \
            --read-only \
            --network none \
            --volume "$PWD/infra/scripts:/mnt:ro" \
            --entrypoint sh \
            koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002 \
            -c 'shellcheck --shell=sh /mnt/*.sh'

      - name: Check affected formatting
        run: >-
          pnpm nx format:check
          --base="${{ needs.changes.outputs.base }}"
          --head="${{ needs.changes.outputs.head }}"

      - name: Check affected projects
        run: >-
          pnpm nx affected
          -t lint,typecheck,test,build
          --base="${{ needs.changes.outputs.base }}"
          --head="${{ needs.changes.outputs.head }}"
          --parallel=3

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  integration:
    needs:
      - changes
      - quality
    if: needs.changes.outputs.has_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changes.outputs.head }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: needs.changes.outputs.e2e_projects != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run affected backend e2e
        if: needs.changes.outputs.backend_e2e_projects != ''
        run: >-
          pnpm nx run-many
          -t e2e
          --projects="${{ needs.changes.outputs.backend_e2e_projects }}"
          --parallel=1

      - name: Run affected frontend e2e
        if: needs.changes.outputs.e2e_projects != ''
        run: >-
          pnpm nx run-many
          -t e2e
          --projects="${{ needs.changes.outputs.e2e_projects }}"
          --parallel=1
          --
          --project=chromium

  images:
    name: images / ${{ matrix.image }}
    needs:
      - changes
      - quality
      - dependency-review
      - integration
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      needs.changes.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.image_matrix) }}

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changes.outputs.head }}

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull BuildKit with retry
        run: |
          set -eu

          attempt=1
          max_attempts=4

          while [ "$attempt" -le "$max_attempts" ]; do
            if docker pull "$BUILDKIT_IMAGE"; then
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Unable to pull BuildKit after $max_attempts attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 15))
            echo "BuildKit pull failed; retrying in ${sleep_seconds}s" >&2
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Resolve image operation
        id: image-operation
        env:
          REQUESTED_BUILD: ${{ matrix.build }}
          SOURCE_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quakke-video-${{ matrix.image }}:${{ needs.changes.outputs.base }}
        run: |
          set -eu

          build="$REQUESTED_BUILD"
          if [ "$build" != "true" ] &&
            ! docker buildx imagetools inspect "$SOURCE_IMAGE" >/dev/null 2>&1; then
            echo "Source image is unavailable; building a complete fallback image."
            build=true
          fi

          printf 'build=%s\n' "$build" >>"$GITHUB_OUTPUT"

      - name: Build affected image for security scan
        if: steps.image-operation.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            PROJECT=${{ matrix.project }}
          tags: quakke-video-ci-${{ matrix.image }}:${{ needs.changes.outputs.head }}
          cache-from: type=gha,scope=${{ matrix.image }}
          load: true
          provenance: false
          sbom: false
          push: false

      - name: Scan affected image before publishing
        if: steps.image-operation.outputs.build == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quakke-video-ci-${{ matrix.image }}:${{ needs.changes.outputs.head }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Publish affected image
        if: steps.image-operation.outputs.build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            PROJECT=${{ matrix.project }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quakke-video-${{ matrix.image }}:${{ needs.changes.outputs.head }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          push: true

      - name: Scan unchanged source image
        if: steps.image-operation.outputs.build == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quakke-video-${{ matrix.image }}:${{ needs.changes.outputs.base }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Promote unchanged image to release SHA
        if: steps.image-operation.outputs.build == 'false'
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quakke-video-${{ matrix.image }}:${{ needs.changes.outputs.base }}
          TARGET_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quakke-video-${{ matrix.image }}:${{ needs.changes.outputs.head }}
        run: docker buildx imagetools create --tag "$TARGET_IMAGE" "$SOURCE_IMAGE"

  deploy:
    needs:
      - changes
      - quality
      - dependency-review
      - integration
      - images
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (needs.dependency-review.result == 'success' || needs.dependency-review.result == 'skipped') &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      (needs.images.result == 'success' || needs.images.result == 'skipped') &&
      needs.changes.outputs.deploy_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-${{ needs.changes.outputs.deploy_environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.changes.outputs.deploy_environment }}
      url: ${{ vars.PUBLIC_URL }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.changes.outputs.head }}

      - name: Reject superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENVIRONMENT: ${{ needs.changes.outputs.deploy_environment }}
          EXPECTED_SHA: ${{ needs.changes.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            current_state=$(gh api \
              "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
              --jq '"\(.state) \(.head.sha)"')
            [ "$current_state" = "open $EXPECTED_SHA" ]
          elif [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            current_sha=$(gh api \
              "repos/${{ github.repository }}/commits/main" \
              --jq '.sha')
            [ "$current_sha" = "$EXPECTED_SHA" ]
          fi

      - name: Validate deployment configuration
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -eu

          case "$DEPLOY_HOST" in
            *[!a-zA-Z0-9.-]* | '') exit 1 ;;
          esac
          case "$DEPLOY_USER" in
            *[!a-zA-Z0-9_-]* | '') exit 1 ;;
          esac
          case "$DEPLOY_PORT" in
            *[!0-9]* | '') exit 1 ;;
          esac
          case "$DEPLOY_PATH" in
            /opt/* | /srv/*) ;;
            *) exit 1 ;;
          esac

      - name: Prepare SSH and deployment bundle
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077

          install -d -m 700 "$HOME/.ssh" deployment
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"

          cp -R infra/compose deployment/
          cp -R infra/nginx deployment/
          cp -R infra/scripts deployment/
          printf '%s\n' "$DEPLOY_ENV_FILE" >deployment/.env
          chmod 700 deployment/scripts/*.sh
          tar -czf deployment.tar.gz -C deployment .

      - name: Upload deployment bundle
        env:
          DEPLOY_ARCHIVE: /tmp/quakke-video-${{ needs.changes.outputs.deploy_environment }}-${{ needs.changes.outputs.head }}.tar.gz
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -eu
          scp -P "$DEPLOY_PORT" \
            deployment.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ARCHIVE"

      - name: Deploy immutable release
        id: deploy-release
        env:
          AFFECTED_SERVICES: ${{ needs.changes.outputs.image_services }}
          DEPLOY_ARCHIVE: /tmp/quakke-video-${{ needs.changes.outputs.deploy_environment }}-${{ needs.changes.outputs.head }}.tar.gz
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          RELEASE_SHA: ${{ needs.changes.outputs.head }}
        run: |
          set -eu

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
             install -d -m 700 '$DEPLOY_PATH'
             tar -xzf '$DEPLOY_ARCHIVE' -C '$DEPLOY_PATH'
             rm '$DEPLOY_ARCHIVE'
             chmod 700 '$DEPLOY_PATH/scripts/'*.sh
             '$DEPLOY_PATH/scripts/deploy.sh' '$RELEASE_SHA' '$AFFECTED_SERVICES'"

      - name: Deploy shared edge
        if: >-
          needs.changes.outputs.deploy_environment == 'production' &&
          needs.changes.outputs.edge_changed == 'true'
        env:
          DEPLOY_EDGE_PATH: ${{ vars.DEPLOY_EDGE_PATH }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -eu

          case "$DEPLOY_EDGE_PATH" in
            /opt/* | /srv/*) ;;
            *) exit 1 ;;
          esac

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "'$DEPLOY_PATH/scripts/deploy-edge.sh' '$DEPLOY_EDGE_PATH'"

      - name: Smoke test
        id: smoke
        continue-on-error: true
        env:
          API_URL: ${{ vars.API_URL }}
          BASIC_AUTH_PASSWORD: ${{ secrets.E2E_BASIC_AUTH_PASSWORD }}
          BASIC_AUTH_USERNAME: ${{ secrets.E2E_BASIC_AUTH_USERNAME }}
          DEPLOY_ENVIRONMENT: ${{ needs.changes.outputs.deploy_environment }}
          WEB_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -eu

          if [ "$DEPLOY_ENVIRONMENT" = "stage" ]; then
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --user "$BASIC_AUTH_USERNAME:$BASIC_AUTH_PASSWORD" \
              "$WEB_URL/" >/dev/null
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              --user "$BASIC_AUTH_USERNAME:$BASIC_AUTH_PASSWORD" \
              "$API_URL/api/health/live" >/dev/null
          else
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "$WEB_URL/" >/dev/null
            curl --fail --silent --show-error --retry 5 --retry-all-errors \
              "$API_URL/api/health/live" >/dev/null
          fi

      - name: Roll back release after failed smoke test
        if: steps.smoke.outcome == 'failure'
        env:
          DEPLOY_EDGE_PATH: ${{ vars.DEPLOY_EDGE_PATH }}
          DEPLOY_ENVIRONMENT: ${{ needs.changes.outputs.deploy_environment }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          EDGE_CHANGED: ${{ needs.changes.outputs.edge_changed }}
        run: |
          set -eu
          rollback_failed=false

          if [ "$DEPLOY_ENVIRONMENT" = "production" ] &&
            [ "$EDGE_CHANGED" = "true" ]; then
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "'$DEPLOY_PATH/scripts/rollback-edge.sh' '$DEPLOY_EDGE_PATH'" ||
              rollback_failed=true
          fi

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "'$DEPLOY_PATH/scripts/rollback.sh'" ||
            rollback_failed=true

          [ "$rollback_failed" = "false" ]

      - name: Fail deployment after rollback
        if: steps.smoke.outcome == 'failure'
        run: exit 1

      - name: Install pnpm
        if: >-
          needs.changes.outputs.deploy_environment == 'stage' &&
          needs.changes.outputs.e2e_projects != ''
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        if: >-
          needs.changes.outputs.deploy_environment == 'stage' &&
          needs.changes.outputs.e2e_projects != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: >-
          needs.changes.outputs.deploy_environment == 'stage' &&
          needs.changes.outputs.e2e_projects != ''
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: >-
          needs.changes.outputs.deploy_environment == 'stage' &&
          needs.changes.outputs.e2e_projects != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run affected stage e2e
        if: >-
          needs.changes.outputs.deploy_environment == 'stage' &&
          needs.changes.outputs.e2e_projects != ''
        env:
          ADMIN_BASE_URL: ${{ vars.ADMIN_URL }}
          E2E_BASIC_AUTH_PASSWORD: ${{ secrets.E2E_BASIC_AUTH_PASSWORD }}
          E2E_BASIC_AUTH_USERNAME: ${{ secrets.E2E_BASIC_AUTH_USERNAME }}
          STUDIO_BASE_URL: ${{ vars.STUDIO_URL }}
          WEB_BASE_URL: ${{ vars.PUBLIC_URL }}
        run: >-
          pnpm nx run-many
          -t e2e
          --projects="${{ needs.changes.outputs.e2e_projects }}"
          --parallel=1
          --
          --project=chromium
