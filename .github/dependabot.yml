version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nx:
        patterns:
          - nx
          - '@nx/*'
      testing:
        patterns:
          - jest
          - jest-*
          - '@jest/*'
          - vitest
          - '@vitest/*'
          - '@playwright/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/compose
    schedule:
      interval: weekly
